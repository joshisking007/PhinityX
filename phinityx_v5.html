<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>PhinityX</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Share+Tech+Mono&family=Rajdhani:wght@600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --red:    #c0152a;
    --plasma: #ff2244;
    --forge:  #ff6a00;
  }

  html, body {
    width:100%; height:100%;
    background:#000;
    overflow:hidden;
  }

  .frame {
    position: relative;
    width: 100vw;
    height: 100dvh;
    overflow: hidden;
  }

  /* Slight right bias — face clears the title panel */
  .char-img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 60% top;
    display: block;
  }

  /* ── OVERLAYS ──
     Vignette now heavier top-right (behind empty space),
     lighter top-left (title zone handles its own darkening).
     Bottom is left alone — loader-panel gradient covers it. */
  .vignette {
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse at 78% 18%, rgba(0,0,0,0.30) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 95%, transparent 25%, rgba(0,0,0,0.28) 80%);
    pointer-events:none; z-index:2;
  }
  .scanlines {
    position:absolute; inset:0;
    background: repeating-linear-gradient(
      to bottom, transparent 0, transparent 3px,
      rgba(0,0,0,0.06) 3px, rgba(0,0,0,0.06) 4px
    );
    z-index:3; pointer-events:none;
  }
  /* tl-dark removed — face unobstructed */

  /* Side glows */
  .edge-glow {
    position:absolute; top:0; bottom:0; width:2px;
    background: linear-gradient(180deg, transparent 5%, rgba(192,21,42,0.6) 50%, transparent 95%);
    z-index:12; opacity:0; animation: fIn 0.5s 1.6s ease forwards;
  }
  .edge-glow--l { left:0; }
  .edge-glow--r { right:0; box-shadow:0 0 10px rgba(192,21,42,0.4); }
  @keyframes fIn { to { opacity:1; } }

  /* Corner brackets */
  .corner {
    position:absolute; width:32px; height:32px; z-index:12;
    opacity:0; animation: cIn 0.4s ease forwards;
  }
  .corner svg { width:100%; height:100%; }
  .corner--tl { top:10px; left:10px;  animation-delay:0.3s; }
  .corner--tr { top:10px; right:10px; transform:scaleX(-1); animation-delay:0.4s; }
  .corner--bl { bottom:10px; left:10px;  transform:scaleY(-1);   animation-delay:0.5s; }
  .corner--br { bottom:10px; right:10px; transform:scale(-1,-1); animation-delay:0.6s; }
  @keyframes cIn { to { opacity:1; } }

  /* ── TOP-RIGHT HUD — fills the dead corner ── */
  .hud-tr {
    position: absolute;
    top: 14px; right: 48px;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
    opacity: 0;
    animation: fadeUp 0.5s 1.0s ease forwards;
  }
  .hud-sys {
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(7px, 1.9vw, 9px);
    letter-spacing: 2.5px;
    color: rgba(255,34,68,0.75);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .hud-dot {
    width: 4px; height: 4px;
    border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 5px #4ade80;
    animation: blinkA 2.4s 1.0s ease infinite;
  }
  .hud-ver {
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(6px, 1.6vw, 8px);
    letter-spacing: 1.5px;
    color: rgba(255,100,100,0.4);
    text-transform: uppercase;
  }
  .hud-ts {
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(6px, 1.6vw, 8px);
    letter-spacing: 1px;
    color: rgba(255,80,80,0.3);
  }

  /* ════════════════════════════════════════
     TITLE ZONE
  ════════════════════════════════════════ */
  .title-zone {
    position: absolute;
    bottom: calc(20% + 14px); right: 4%;
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 5px;
    padding: 10px 10px 10px 20px;
    border-right: 2.5px solid rgba(255,34,68,0.85);
    background: linear-gradient(250deg,
      rgba(0,0,0,0.78) 0%,
      rgba(5,0,2,0.55) 65%,
      transparent 100%
    );
    opacity: 0;
    animation: panelIn 0.7s 0.4s cubic-bezier(0.16,1,0.3,1) forwards;
    max-width: 70vw;
  }
  @keyframes panelIn {
    from { opacity:0; transform:translateX(16px); }
    to   { opacity:1; transform:translateX(0); }
  }

  .logo-word {
    font-family: 'Orbitron', monospace;
    font-weight: 900;
    font-size: 9.5vw;
    letter-spacing: -0.02em;
    line-height: 1;
    white-space: nowrap;
    position: relative;
    display: inline-block;
    background: linear-gradient(
      160deg,
      #ffffff  0%,
      #ffa0a0  10%,
      #ff2244  28%,
      #900010  52%,
      #c00020  66%,
      #ff5577  82%,
      #ffffff  100%
    );
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    background-size: 200% 200%;
    filter:
      drop-shadow(0 0 3px rgba(255,255,255,0.8))
      drop-shadow(0 0 8px rgba(255,34,68,1))
      drop-shadow(0 0 22px rgba(255,34,68,0.7))
      drop-shadow(0 0 50px rgba(192,0,30,0.4));
    animation:
      logoIn    1s   0.5s cubic-bezier(0.16,1,0.3,1) both,
      gradShift 4s   1.8s ease-in-out infinite alternate,
      glowShift 3s   1.8s ease-in-out infinite alternate;
  }
  @keyframes logoIn {
    from { opacity:0; transform:translateX(-18px) skewX(-6deg); filter:blur(16px); }
    to   { opacity:1; transform:translateX(0) skewX(0); filter:blur(0); }
  }
  @keyframes gradShift {
    0%   { background-position:0% 50%; }
    100% { background-position:100% 50%; }
  }
  @keyframes glowShift {
    0%   { filter: drop-shadow(0 0 3px #fff) drop-shadow(0 0 9px #ff2244) drop-shadow(0 0 24px rgba(255,34,68,0.65)); }
    50%  { filter: drop-shadow(0 0 5px rgba(255,140,0,0.9)) drop-shadow(0 0 16px #ff4400) drop-shadow(0 0 45px rgba(255,60,0,0.5)); }
    100% { filter: drop-shadow(0 0 2px #fff) drop-shadow(0 0 7px #ff2244) drop-shadow(0 0 70px rgba(192,0,30,0.3)); }
  }

  /* Glitch ghosts */
  .logo-word::before {
    content: attr(data-text);
    position:absolute; top:0; left:0;
    font-family:'Orbitron',monospace;
    font-weight:900; font-size:inherit; letter-spacing:inherit;
    white-space:nowrap;
    -webkit-text-fill-color: #00ffcc;
    opacity:0; pointer-events:none;
    animation: glitchC 5s 3s infinite;
  }
  .logo-word::after {
    content: attr(data-text);
    position:absolute; top:0; left:0;
    font-family:'Orbitron',monospace;
    font-weight:900; font-size:inherit; letter-spacing:inherit;
    white-space:nowrap;
    -webkit-text-fill-color: #ff0055;
    opacity:0; pointer-events:none;
    animation: glitchR 5s 3.2s infinite;
  }
  @keyframes glitchC {
    0%,91%,100% { opacity:0; transform:none; }
    91.5% { opacity:0.7; transform:translate(-3px,1px) skewX(-9deg); clip-path:polygon(0 10%,100% 10%,100% 42%,0 42%); }
    92%   { opacity:0; }
    94%   { opacity:0.45; transform:translate(2px,-2px) skewX(6deg); clip-path:polygon(0 58%,100% 58%,100% 84%,0 84%); }
    94.5% { opacity:0; }
  }
  @keyframes glitchR {
    0%,89%,100% { opacity:0; transform:none; }
    89.5% { opacity:0.6; transform:translate(3px,-1px) skewX(11deg); clip-path:polygon(0 4%,100% 4%,100% 38%,0 38%); }
    90%   { opacity:0; }
    92.5% { opacity:0.4; transform:translate(-2px,2px) skewX(-5deg); clip-path:polygon(0 52%,100% 52%,100% 80%,0 80%); }
    93%   { opacity:0; }
  }

  /* Divider — expands in, then loops a shimmer sweep */
  .logo-divider {
    height: 2px;
    width: 0%;
    background: linear-gradient(270deg, #ff2244 0%, #ff6a00 60%, transparent 100%);
    box-shadow: 0 0 8px #ff2244, 0 0 18px rgba(255,34,68,0.4);
    position: relative;
    overflow: hidden;
    animation: divLine 0.6s 1.3s ease forwards;
  }
  @keyframes divLine { to { width:100%; } }
  .logo-divider::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.75) 50%, transparent);
    transform: translateX(-100%);
    animation: divShimmer 2.4s 2.4s ease-in-out infinite;
  }
  @keyframes divShimmer {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(320%); }
  }

  .logo-sub {
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(8px, 2.4vw, 11px);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    white-space: nowrap;
    color: rgba(255,210,210,0.92);
    text-shadow: 0 0 5px rgba(255,80,80,0.9), 0 0 14px rgba(255,34,68,0.6);
    opacity: 0;
    animation: subIn 0.5s 1.6s ease forwards;
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .logo-sub::before {
    content: '◆';
    color: var(--plasma);
    font-size: 7px;
    text-shadow: 0 0 6px #ff2244;
    flex-shrink: 0;
  }
  @keyframes subIn {
    from { opacity:0; transform:translateX(10px); }
    to   { opacity:1; transform:translateX(0); }
  }

  /* ════════════════════════════════════════
     CHAIN FORGE LOADER
  ════════════════════════════════════════ */
  .loader-panel {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 20%;
    background: linear-gradient(
      180deg,
      transparent 0%,
      rgba(3,0,1,0.72) 25%,
      rgba(2,0,0,0.95) 55%,
      #000 100%
    );
    z-index: 20;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
    padding-bottom: 14px;
    gap: 6px;
  }
  .edge-line {
    position:absolute; bottom:0; left:0; right:0; height:2px;
    background: linear-gradient(90deg,
      transparent 0%, var(--plasma) 20%,
      var(--forge) 50%, var(--plasma) 80%, transparent 100%
    );
    box-shadow: 0 0 12px var(--plasma), 0 0 28px rgba(255,34,68,0.35);
    opacity:0; animation: fIn 0.5s 1.8s ease forwards;
  }

  .forge-status {
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(8px, 2.2vw, 10px);
    color: rgba(255,90,90,0.65);
    letter-spacing: 3px;
    text-transform: uppercase;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
    opacity: 0;
    animation: fadeUp 0.5s 2.0s ease forwards;
  }
  #statusText {
    transition: opacity 0.4s ease;
  }
  .blink {
    width: 5px; height: 5px;
    background: var(--plasma);
    border-radius: 50%;
    box-shadow: 0 0 6px var(--plasma);
    animation: blinkA 1.1s 2.0s ease infinite;
    flex-shrink: 0;
  }
  @keyframes blinkA { 0%,100% { opacity:1; } 50% { opacity:0.1; } }

  .chain-loader {
    width: 86%;
    opacity: 0;
    animation: fadeUp 0.4s 2.2s ease forwards;
  }
  .chain-row {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
  }
  .chain-track {
    flex: 1;
    height: 22px;
    display: flex;
    align-items: center;
    gap: 2px;
    position: relative;
  }
  .link {
    flex: 1;
    height: 100%;
    border: 1.5px solid rgba(255,34,68,0.18);
    border-radius: 2px;
    background: rgba(255,20,40,0.04);
    position: relative;
  }
  .link.lit {
    background: linear-gradient(135deg, #ff1a35, #9b0010, #ff4422);
    border-color: #ff2244;
    box-shadow:
      0 0 6px rgba(255,34,68,0.9),
      0 0 16px rgba(255,34,68,0.4),
      inset 0 1px 0 rgba(255,180,180,0.3);
    animation: linkForge 0.13s ease forwards;
  }
  /* Bar stays alive after 100% — pulses instead of going dead */
  .link.lit.idle-pulse {
    animation: linkIdlePulse 2.6s ease-in-out infinite;
  }
  @keyframes linkIdlePulse {
    0%,100% { box-shadow: 0 0 6px rgba(255,34,68,0.9), 0 0 16px rgba(255,34,68,0.4), inset 0 1px 0 rgba(255,180,180,0.3); }
    50%     { box-shadow: 0 0 12px rgba(255,34,68,1),  0 0 32px rgba(255,34,68,0.6), inset 0 1px 0 rgba(255,200,200,0.5); }
  }
  .link.sparking::after {
    content: '';
    position: absolute;
    right: -3px; top: -5px;
    width: 8px; height: 32px;
    background: radial-gradient(ellipse, #fff 0%, #ffaa00 30%, transparent 70%);
    border-radius: 50%;
    animation: sparkFade 0.28s ease forwards;
    pointer-events: none;
    z-index: 5;
  }
  @keyframes linkForge {
    0%   { transform:scaleY(0.5); filter:brightness(4); }
    60%  { transform:scaleY(1.12); }
    100% { transform:scaleY(1); filter:brightness(1); }
  }
  @keyframes sparkFade {
    0%   { opacity:1; transform:scaleY(1.6) scaleX(0.5); }
    100% { opacity:0; transform:scaleY(0.2) scaleX(2) translateY(-8px); }
  }

  .power-core {
    position: absolute;
    top:50%; left:50%;
    transform: translate(-50%, -50%);
    width: 28px; height: 28px;
    z-index: 3; pointer-events: none;
  }
  .core-inner {
    width:100%; height:100%; border-radius:50%;
    background: radial-gradient(circle, #fff 0%, #ff2244 40%, transparent 72%);
    animation: corePulse 1.3s ease-in-out infinite;
    box-shadow: 0 0 14px #ff2244, 0 0 30px rgba(255,34,68,0.5);
  }
  @keyframes corePulse { 0%,100% { transform:scale(1); } 50% { transform:scale(1.35); } }

  .forge-percent {
    font-family: 'Orbitron', monospace;
    font-weight: 700;
    font-size: clamp(11px, 3vw, 15px);
    color: var(--plasma);
    letter-spacing: 1px;
    text-shadow: 0 0 10px var(--plasma), 0 0 24px rgba(255,34,68,0.5);
    width: 4ch;
    text-align: right;
    flex-shrink: 0;
    opacity: 0;
    animation: fadeUp 0.4s 2.3s ease forwards;
  }

  .forge-label {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: clamp(8px, 2.1vw, 10px);
    letter-spacing: 3px;
    color: rgba(255,60,80,0.45);
    text-transform: uppercase;
    white-space: nowrap;
    opacity: 0;
    animation: fadeUp 0.4s 2.5s ease forwards;
  }

  @keyframes fadeUp {
    from { opacity:0; transform:translateY(6px); }
    to   { opacity:1; transform:translateY(0); }
  }
</style>
</head>
<body>
<div class="frame">

  <img class="char-img" src="https://raw.githubusercontent.com/joshisking007/PhinityX/main/phinityx-loader-pic.png" alt="PhinityX" />

  <div class="vignette"></div>
  <div class="scanlines"></div>
  <div class="edge-glow edge-glow--l"></div>
  <div class="edge-glow edge-glow--r"></div>

  <div class="corner corner--tl"><svg viewBox="0 0 36 36" fill="none"><path d="M2 18 L2 2 L18 2" stroke="#ff2244" stroke-width="2.5" stroke-linecap="round"/></svg></div>
  <div class="corner corner--tr"><svg viewBox="0 0 36 36" fill="none"><path d="M2 18 L2 2 L18 2" stroke="#ff2244" stroke-width="2.5" stroke-linecap="round"/></svg></div>
  <div class="corner corner--bl"><svg viewBox="0 0 36 36" fill="none"><path d="M2 18 L2 2 L18 2" stroke="#ff2244" stroke-width="2.5" stroke-linecap="round"/></svg></div>
  <div class="corner corner--br"><svg viewBox="0 0 36 36" fill="none"><path d="M2 18 L2 2 L18 2" stroke="#ff2244" stroke-width="2.5" stroke-linecap="round"/></svg></div>

  <!-- TOP-RIGHT HUD -->
  <div class="hud-tr">
    <div class="hud-sys"><span class="hud-dot"></span>SYS.ONLINE</div>
    <div class="hud-ver">v7.∞ · build 001</div>
    <div class="hud-ts" id="hudTs"></div>
  </div>

  <!-- TITLE -->
  <div class="title-zone">
    <div class="logo-word" data-text="PhinityX">PhinityX</div>
    <div class="logo-divider"></div>
    <div class="logo-sub">Paradigm Leveling</div>
  </div>

  <!-- LOADER -->
  <div class="loader-panel">
    <div class="edge-line"></div>
    <div class="forge-status">
      <span class="blink"></span>
      <span id="statusText">INITIALISING SYSTEMS</span>
      <span class="blink" style="animation-delay:0.6s"></span>
    </div>
    <div class="chain-loader">
      <div class="chain-row">
        <div class="chain-track" id="chainTrack"></div>
        <div class="forge-percent" id="pct">0%</div>
      </div>
    </div>
    <div class="forge-label">Combat Protocol — Reality Compiler v7.∞</div>
  </div>

</div>

<script>
// ── Live clock in HUD ──────────────────────────────────────────────────────
(function tickClock() {
  const el = document.getElementById('hudTs');
  if (el) {
    const n = new Date();
    el.textContent =
      String(n.getHours()).padStart(2,'0')   + ':' +
      String(n.getMinutes()).padStart(2,'0') + ':' +
      String(n.getSeconds()).padStart(2,'0');
  }
  setTimeout(tickClock, 1000);
})();

// ── Status messages — cycle through as bar fills ───────────────────────────
const STATUS_MSGS = [
  'INITIALISING SYSTEMS',
  'LOADING ASSET CACHE',
  'BINDING CHAIN FORGE',
  'COMPILING SHADERS',
  'SYNCING REALITY MESH',
  'CALIBRATING COMBAT AI',
  'FORGING REALITY',
  'SYSTEMS ONLINE',
];
const statusEl = document.getElementById('statusText');

function setStatus(idx) {
  statusEl.style.opacity = '0';
  setTimeout(() => {
    statusEl.textContent = STATUS_MSGS[idx] || STATUS_MSGS[STATUS_MSGS.length - 1];
    statusEl.style.opacity = '1';
  }, 220);
}

// ── Chain forge bar ────────────────────────────────────────────────────────
const LINKS = 28;
const track = document.getElementById('chainTrack');
const pctEl = document.getElementById('pct');

for (let i = 0; i < LINKS; i++) {
  const l = document.createElement('div');
  l.className = 'link';
  l.id = 'lnk' + i;
  track.appendChild(l);
}
const core = document.createElement('div');
core.className = 'power-core';
core.innerHTML = '<div class="core-inner"></div>';
track.appendChild(core);

let filled = 0;
const center = Math.floor(LINKS / 2);
let li = center - 1, ri = center;

// Status gates keyed to filled count (out of LINKS=28)
// Maps filled value → STATUS_MSGS index
const STATUS_GATES = {
  4:  1,   // LOADING ASSET CACHE
  8:  2,   // BINDING CHAIN FORGE
  12: 3,   // COMPILING SHADERS
  16: 4,   // SYNCING REALITY MESH
  20: 5,   // CALIBRATING COMBAT AI
  24: 6,   // FORGING REALITY
  28: 7,   // SYSTEMS ONLINE
};

function tick() {
  if (filled >= LINKS) {
    pctEl.textContent = '100%';
    pctEl.style.color = '#fff';
    pctEl.style.textShadow = '0 0 20px #fff, 0 0 50px #ff2244';

    // Flash all links then settle into idle glow pulse
    document.querySelectorAll('.link').forEach((el, i) => {
      setTimeout(() => {
        el.style.filter = 'brightness(4)';
        setTimeout(() => {
          el.style.filter = '';
          el.style.transition = 'filter 0.7s';
          el.classList.add('idle-pulse');
        }, 80);
      }, i * 14);
    });

    // ── Production hook ─────────────────────────────────────────────────────
    // The loader has done its job. Your app had ~5–6 seconds to prefetch
    // fonts, establish auth sessions, lazy-load modules, etc.
    // Call onLoaderComplete() or replace with your own boot sequence.
    setTimeout(onLoaderComplete, 900);
    return;
  }

  if (li >= 0) {
    const el = document.getElementById('lnk' + li);
    if (el) { el.classList.add('lit', 'sparking'); }
    li--; filled++;
  }
  if (ri < LINKS) {
    const el = document.getElementById('lnk' + ri);
    if (el) { el.classList.add('lit', 'sparking'); }
    ri++; filled++;
  }

  const pct = Math.min(100, Math.round((filled / LINKS) * 100));
  pctEl.textContent = pct + '%';

  if (STATUS_GATES[filled] !== undefined) {
    setStatus(STATUS_GATES[filled]);
  }

  setTimeout(() => {
    document.querySelectorAll('.sparking').forEach(e => e.classList.remove('sparking'));
  }, 300);

  // Pacing — deliberate slow start so the screen has time to breathe,
  // steady burn through the middle, quick satisfying finish.
  // Total forge animation ≈ 5.2s. With the 2.8s pre-delay the user
  // sees ~8s of loader — enough time for fonts, auth, lazy modules.
  const d = filled <= 4  ? 340   // ramp up — let the UI settle
           : filled <= 10 ? 230  // steady burn
           : filled <= 18 ? 170  // mid-pace
           : filled <= 24 ? 110  // tightening
           :                65;  // final sprint

  setTimeout(tick, d);
}

// Start forge after all UI elements have animated in
setTimeout(tick, 2800);

// ── Production hook ────────────────────────────────────────────────────────
// Wire this to your app's real init sequence.
// e.g. fade out loader → call initApp() / router.push('/home') etc.
function onLoaderComplete() {
  console.log('[PhinityX] Loader complete — ready to boot.');
  // Example:
  // document.querySelector('.frame').style.transition = 'opacity 0.6s ease';
  // document.querySelector('.frame').style.opacity = '0';
  // setTimeout(() => initApp(), 650);
}
</script>
</body>
</html>
