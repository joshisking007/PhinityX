<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Paradigm Leveling — Loader</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@800&family=Barlow+Condensed:wght@300&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }

  #ariaLoader {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.65s cubic-bezier(0.4, 0, 0.2, 1),
                visibility 0.65s cubic-bezier(0.4, 0, 0.2, 1);
    will-change: opacity;
    transform: translateZ(0);
  }
  #ariaLoader.fade-out {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .pl2-bg-glow {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background:
      radial-gradient(ellipse at 30% 50%, rgba(59,130,246,0.07) 0%, transparent 55%),
      radial-gradient(ellipse at 70% 50%, rgba(52,211,153,0.05) 0%, transparent 55%);
  }

  .pl2-loader {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    position: relative;
    z-index: 1;
    perspective: 900px;
    transform-style: preserve-3d;
  }

  .pl2-chevrons {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    margin-bottom: 36px;
    position: relative;
    transform-style: preserve-3d;
  }

  .pl2-ch {
    width: 58px;
    height: 76px;
    flex-shrink: 0;
    position: relative;
    opacity: 0;
    will-change: transform, opacity;
    transform-style: preserve-3d;
  }
  .pl2-ch svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .pl2-ch::after {
    content: '';
    position: absolute;
    inset: -12px;
    border-radius: 12px;
    opacity: 0;
    will-change: opacity;
  }
  .pl2-ch-1::after { background: radial-gradient(ellipse at center, rgba(59,130,246,0.35) 0%, transparent 70%);  animation: pl2HaloIn 0.4s 0.85s both; }
  .pl2-ch-2::after { background: radial-gradient(ellipse at center, rgba(56,189,248,0.30) 0%, transparent 70%);  animation: pl2HaloIn 0.4s 1.02s both; }
  .pl2-ch-3::after { background: radial-gradient(ellipse at center, rgba(52,211,153,0.28) 0%, transparent 70%);  animation: pl2HaloIn 0.4s 1.19s both; }
  .pl2-ch-4::after { background: radial-gradient(ellipse at center, rgba(110,231,183,0.25) 0%, transparent 70%); animation: pl2HaloIn 0.4s 1.36s both; }
  @keyframes pl2HaloIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  .pl2-ch-1 {
    animation:
      pl2FlyIn1 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both,
      pl2Idle   3.2s  ease-in-out                     1.5s  infinite;
  }
  @keyframes pl2FlyIn1 {
    0%   { opacity: 0; transform: translate3d(-120px, -80px, -400px) rotateY(90deg) rotateZ(-25deg) scale(0.4); }
    60%  { opacity: 1; }
    85%  { transform: translate3d(4px, -4px, 0) rotateY(-6deg) rotateZ(2deg) scale(1.04); }
    100% { opacity: 1; transform: translate3d(0,0,0) rotateY(0) rotateZ(0) scale(1); }
  }

  .pl2-ch-2 {
    animation:
      pl2FlyIn2 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.32s both,
      pl2Idle   3.2s  ease-in-out                     1.65s infinite;
  }
  @keyframes pl2FlyIn2 {
    0%   { opacity: 0; transform: translate3d(0, 120px, -600px) rotateX(-70deg) rotateY(15deg) scale(0.2); }
    60%  { opacity: 1; }
    85%  { transform: translate3d(0, -5px, 0) rotateX(5deg) scale(1.06); }
    100% { opacity: 1; transform: translate3d(0,0,0) rotateX(0) rotateY(0) scale(1); }
  }

  .pl2-ch-3 {
    animation:
      pl2FlyIn3 0.75s cubic-bezier(0.22, 1, 0.36, 1) 0.49s both,
      pl2Idle   3.2s  ease-in-out                     1.8s  infinite;
  }
  @keyframes pl2FlyIn3 {
    0%   { opacity: 0; transform: translate3d(140px, -60px, -300px) rotateZ(180deg) rotateY(-50deg) scale(0.3); }
    60%  { opacity: 1; }
    85%  { transform: translate3d(-3px, 3px, 0) rotateZ(-4deg) rotateY(4deg) scale(1.05); }
    100% { opacity: 1; transform: translate3d(0,0,0) rotateZ(0) rotateY(0) scale(1); }
  }

  .pl2-ch-4 {
    animation:
      pl2FlyIn4 0.8s  cubic-bezier(0.22, 1, 0.36, 1) 0.66s both,
      pl2Idle   3.2s  ease-in-out                     1.95s infinite;
  }
  @keyframes pl2FlyIn4 {
    0%   { opacity: 0; transform: translate3d(60px, -160px, -500px) rotateX(120deg) rotateZ(-60deg) scale(0.2); }
    50%  { opacity: 0.8; }
    85%  { transform: translate3d(-2px, 5px, 0) rotateX(-5deg) rotateZ(3deg) scale(1.07); }
    100% { opacity: 1; transform: translate3d(0,0,0) rotateX(0) rotateZ(0) scale(1); }
  }

  @keyframes pl2Idle {
    0%,100% { transform: translateX(0) translateY(0) scale(1); }
    50%     { transform: translateX(2px) translateY(-3px) scale(1.03); }
  }

  .pl2-chevrons-shadow {
    width: 220px;
    height: 16px;
    background: radial-gradient(ellipse, rgba(52,211,153,0.25) 0%, transparent 70%);
    margin-bottom: 4px;
    animation: pl2ShadowIn 0.6s 1.2s both;
    transform-origin: center;
    will-change: opacity, transform;
  }
  @keyframes pl2ShadowIn {
    from { opacity: 0; transform: scaleX(0.4); }
    to   { opacity: 1; transform: scaleX(1); }
  }

  .pl2-wordmark {
    text-align: center;
    position: relative;
    margin-top: 8px;
    transform: translateZ(0);
  }

  .pl2-paradigm {
    font-family: 'Barlow', 'Arial Black', sans-serif;
    font-weight: 800;
    font-size: clamp(48px, 12vw, 68px);
    letter-spacing: 0.04em;
    line-height: 1;
    background: linear-gradient(135deg, #ffffff 0%, #93c5fd 50%, #6ee7b7 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 22px rgba(59,130,246,0.45));
    animation: pl2FadeUp 0.9s 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
    will-change: transform, opacity;
  }

  .pl2-divider {
    width: 100%;
    height: 2px;
    position: relative;
    margin: 12px 0;
    background: linear-gradient(90deg, transparent, #3b82f6 30%, #34d399 70%, transparent);
    border-radius: 2px;
    overflow: hidden;
    transform-origin: left center;
    animation: pl2DividerExpand 0.7s 1.25s cubic-bezier(0.22, 1, 0.36, 1) both;
    will-change: transform, opacity;
  }
  @keyframes pl2DividerExpand {
    from { transform: scaleX(0); opacity: 0; }
    to   { transform: scaleX(1); opacity: 1; }
  }

  .pl2-divider-shine {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.8) 50%, transparent);
    animation: pl2DividerShine 0.9s 1.6s cubic-bezier(0.4, 0, 0.2, 1) both;
    will-change: transform;
  }
  @keyframes pl2DividerShine {
    from { transform: translateX(-100%); }
    to   { transform: translateX(200%); }
  }

  .pl2-leveling {
    font-family: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    font-weight: 300;
    font-size: clamp(16px, 4.5vw, 26px);
    letter-spacing: 0.45em;
    color: #9ca3af;
    animation: pl2FadeUp 0.7s 1.4s cubic-bezier(0.22, 1, 0.36, 1) both;
    will-change: transform, opacity;
  }

  @keyframes pl2FadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div id="ariaLoader">
  <div class="pl2-bg-glow"></div>
  <div class="pl2-loader">

    <div class="pl2-chevrons">

      <div class="pl2-ch pl2-ch-1">
        <svg viewBox="0 0 60 80" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="pl2-lg1" x1="0" y1="0" x2="60" y2="80" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#3b82f6"/>
              <stop offset="100%" stop-color="#1d4ed8"/>
            </linearGradient>
            <filter id="pl2-glow1">
              <feGaussianBlur stdDeviation="3" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <path d="M8 4 L52 40 L8 76" stroke="url(#pl2-lg1)" stroke-width="13"
            stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#pl2-glow1)"/>
        </svg>
      </div>

      <div class="pl2-ch pl2-ch-2">
        <svg viewBox="0 0 60 80" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="pl2-lg2" x1="0" y1="0" x2="60" y2="80" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#38bdf8"/>
              <stop offset="100%" stop-color="#34d399"/>
            </linearGradient>
            <filter id="pl2-glow2">
              <feGaussianBlur stdDeviation="3" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <path d="M8 4 L52 40 L8 76" stroke="url(#pl2-lg2)" stroke-width="13"
            stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#pl2-glow2)"/>
        </svg>
      </div>

      <div class="pl2-ch pl2-ch-3">
        <svg viewBox="0 0 60 80" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="pl2-lg3" x1="0" y1="0" x2="60" y2="80" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#4ade80"/>
              <stop offset="100%" stop-color="#34d399"/>
            </linearGradient>
            <filter id="pl2-glow3">
              <feGaussianBlur stdDeviation="3" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <path d="M8 4 L52 40 L8 76" stroke="url(#pl2-lg3)" stroke-width="13"
            stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#pl2-glow3)"/>
        </svg>
      </div>

      <div class="pl2-ch pl2-ch-4">
        <svg viewBox="0 0 60 80" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="pl2-lg4" x1="0" y1="0" x2="60" y2="80" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#6ee7b7"/>
              <stop offset="100%" stop-color="#a7f3d0"/>
            </linearGradient>
            <filter id="pl2-glow4">
              <feGaussianBlur stdDeviation="3" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <path d="M8 4 L52 40 L8 76" stroke="url(#pl2-lg4)" stroke-width="13"
            stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#pl2-glow4)"/>
        </svg>
      </div>

    </div>

    <div class="pl2-chevrons-shadow"></div>

    <div class="pl2-wordmark">
      <div class="pl2-paradigm">PARADIGM</div>
      <div class="pl2-divider"><div class="pl2-divider-shine"></div></div>
      <div class="pl2-leveling">L E V E L I N G</div>
    </div>

  </div>
</div>

</body>
</html>
